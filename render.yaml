services:
  - type: web
    name: hypex-ml-service
    runtime: python
    plan: starter
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
